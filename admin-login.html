<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solution X | Admin Login</title>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <style>
    body{
      font-family: Arial, sans-serif;
      background:#f4f6f9;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .login-box{
      background:white;
      padding:40px;
      border-radius:10px;
      width:350px;
      box-shadow:0 5px 20px rgba(0,0,0,0.1);
    }

    h2{
      text-align:center;
      margin-bottom:20px;
    }

    input{
      width:100%;
      padding:12px;
      margin-bottom:15px;
      border:1px solid #ccc;
      border-radius:5px;
    }

    button{
      width:100%;
      padding:12px;
      background:#007BFF;
      color:white;
      border:none;
      border-radius:5px;
      cursor:pointer;
    }

    button:hover{
      background:#0056b3;
    }
  </style>
</head>

<body>

<div class="login-box">
  <h2>Admin Login</h2>

  <input type="email" id="email" placeholder="Admin Email">
  <input type="password" id="password" placeholder="Password">

  <button onclick="login()">Login</button>
</div>

<script>

  // PASTE YOUR FIREBASE CONFIG BELOW
  const firebaseConfig = {
    apiKey: "AIzaSyDKlEPf6VH97L4GgDMSzbfCQegLHvLZ2RM",
    authDomain: "solution-x-ca3b9.firebaseapp.com",
    projectId: "solution-x-ca3b9",
    storageBucket: "solution-x-ca3b9.firebasestorage.app",
    messagingSenderId: "265989424146",
    appId: "1:265989424146:web:b3224d861e9a99e2cd04cb"
  };

  // Initialize Firebase
  firebase.initializeApp(firebaseConfig);

  // Login Function
  function login(){

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    firebase.auth()
      .signInWithEmailAndPassword(email,password)
      .then(() => {

        localStorage.setItem("adminLoggedIn", "true");
        alert("Login successful!");

        window.location.href = "admin.html";

      })
      .catch((error) => {

        alert(error.message);

      });
  }

</script>

</body>
</html>
